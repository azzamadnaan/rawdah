name: Build Rawdah APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Regenerate android folder
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name rawdah --org com.rawdah

      - name: Pin geolocator_android to a compatible version
        run: |
          if grep -q '^dependency_overrides:' pubspec.yaml; then
            sed -i '/^dependency_overrides:/a\  geolocator_android: 4.6.1' pubspec.yaml
          else
            printf '\ndependency_overrides:\n  geolocator_android: 4.6.1\n' >> pubspec.yaml
          fi

      - name: Set SDK versions (safe, no afterEvaluate)
        run: |
          f=android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' $f
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/' $f
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' $f
          cat >> android/build.gradle <<'EOF'

          subprojects {
              plugins.withId("com.android.library") {
                  extensions.configure(com.android.build.gradle.LibraryExtension) { ext ->
                      if (ext.compileSdkVersion == null) {
                          ext.compileSdkVersion(34)
                      }
                  }
              }
          }
          EOF

      - name: Add Manifest permissions and app name
        run: |
          python3 - <<'EOF'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
          """
          if "ACCESS_FINE_LOCATION" not in s:
              i = s.index(">", s.index("<manifest")) + 1
              s = s[:i] + perms + s[i:]
          s = s.replace('android:label="rawdah"', 'android:label="روضة"')
          if "<queries>" not in s:
              s = s.replace("</manifest>", '<queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries></manifest>')
          open(p, "w", encoding="utf-8").write(s)
          EOF

      - name: Ensure assets exist
        run: |
          mkdir -p assets/videos assets/data assets/audio
          [ -f assets/data/messages.json ] || echo '["قال تعالى: ﴿ألا بذكر الله تطمئن القلوب﴾"]' > assets/data/messages.json
          [ -f assets/videos/welcome.mp4 ] || touch assets/videos/welcome.mp4

      - name: Copy adhan sound to Android raw resources
        run: |
          mkdir -p android/app/src/main/res/raw
          if [ -f assets/audio/adhan.mp3 ]; then
            cp assets/audio/adhan.mp3 android/app/src/main/res/raw/adhan.mp3
            echo "تم نسخ صوت الأذان."
          else
            echo "تحذير: لم يُرفع assets/audio/adhan.mp3، سيستخدم صوت النظام الافتراضي."
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icon
        run: |
          if [ -f assets/icon/icon.png ]; then
            dart run flutter_launcher_icons
          else
            echo "No icon found, using default"
          fi

      - name: Build APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BASE_URL: ${{ vars.GEMINI_BASE_URL }}
        run: >
          flutter build apk --release
          --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"
          --dart-define=GEMINI_BASE_URL="$GEMINI_BASE_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rawdah-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
