name: rawdah
description: تطبيق روضة الإسلامي
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  geolocator: ^12.0.0
  shared_preferences: ^2.2.3
  video_player: ^2.8.6
  just_audio: ^0.9.38
  dio: ^5.4.3
  http: ^1.2.1
  path_provider: ^2.1.3
  url_launcher: ^6.2.6
  google_fonts: ^6.2.1
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^1.0.8

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/videos/welcome.mp4
    - assets/data/messages.json
